<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator - Swasthya Salah</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="logo"><img src="/logo.png"><span>SwasthyaSalah</span></div><nav><a href="/index.html" data-t="home">होम</a><a href="/calculator.html" data-t="calculator">कैलकुलेटर</a><a href="/chatbot.html" data-t="chat">चैटबॉट</a><select id="langSel" class="lang-select"><option value="hi">हिंदी</option><option value="en_us">USA English</option><option value="en_gb">UK English</option></select></nav></header>
<div class="container"><div class="card"><h1 data-t="calc_title">BMI कैलकुलेटर</h1><label data-t="calc_h">ऊंचाई (cm)</label><input id="h" type="number" value="170"><label data-t="calc_w">वजन (kg)</label><input id="w" type="number" value="70"><button class="btn" onclick="calc()" data-t="calc_btn">गणना करें</button><h3 id="res" style="margin-top:12px"></h3></div></div>
<script>function calc(){let h=document.getElementById('h').value/100;let w=document.getElementById('w').value;let bmi=(w/(h*h)).toFixed(1);let c=bmi<18.5?'Underweight':bmi<24.9?'Normal':bmi<29.9?'Overweight':'Obese';document.getElementById('res').innerText='BMI: '+bmi+' ('+c+')';}</script><footer><p>Swasthya Salah</p></footer><script src="/lang.js"></script></body></html>
