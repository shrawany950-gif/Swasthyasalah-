<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo"><img src="logo.png">SwasthyaSalah</div><a href="index.html" style="color:#fff" data-t="home">होम</a><select id="language-select" class="lang" onchange="changeLanguage(this.value)"><option value="hi">हिन्दी</option><option value="en">USA English</option><option value="en-GB">UK English</option></select></header>
<div class="container"><div class="card"><h1 data-t="calc_title">BMI</h1><label data-t="calc_h">Height</label><input id="h" type="number" placeholder="170"><label data-t="calc_w">Weight</label><input id="w" type="number" placeholder="70"><button class="btn" onclick="calc()" data-t="calc_btn">Calculate</button><p id="res" style="margin-top:12px;font-weight:700"></p></div></div>
<script>function calc(){let h=document.getElementById('h').value/100;let w=document.getElementById('w').value;if(!h||!w) return;let bmi=(w/(h*h)).toFixed(1);document.getElementById('res').innerText=(LANG_DATA[localStorage.getItem('lang')||'hi']?.calc_result||'Result')+": "+bmi}</script>
<script src="lang.js"></script></body></html>
