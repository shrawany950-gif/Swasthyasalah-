<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator - SwasthyaSalah</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="logo"><img src="/logo.png"><span data-i18n="site_name">SwasthyaSalah</span></div>
<nav><a href="/index.html" data-i18n="nav_home">Home</a><a href="/about.html" data-i18n="nav_about">About</a><a href="/blog.html" data-i18n="nav_blog">Blog</a><a href="/calculator.html" data-i18n="nav_calculator">Calculator</a><a href="/chatbot.html" data-i18n="nav_chatbot">Chatbot</a><a href="/contact.html" data-i18n="nav_contact">Contact</a><select id="langSelect" onchange="setLanguage(this.value)"><option value="hi">हिन्दी</option><option value="en-US">USA English</option><option value="en-GB">UK English</option></select></nav></header>
<section style="padding:30px 6%"><h1 data-i18n="calc_title">Health Calculator</h1>
<div class="cards">
<div class="card"><h3>BMI Calculator</h3><input id="h" type="number" placeholder="Height cm" style="width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ccc"><input id="w" type="number" placeholder="Weight kg" style="width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ccc"><button class="btn" onclick="calcBMI()">Calculate</button><p id="bmiR" style="margin-top:10px;font-weight:700"></p></div>
<div class="card"><h3>Water Intake</h3><input id="wt" type="number" placeholder="Weight kg" style="width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ccc"><button class="btn" onclick="calcWater()">Calculate</button><p id="wR" style="margin-top:10px;font-weight:700"></p></div>
<div class="card"><h3>BMR</h3><input id="age" type="number" placeholder="Age"><input id="wh" type="number" placeholder="Weight kg"><input id="hh" type="number" placeholder="Height cm"><button class="btn" onclick="calcBMR()">Calculate</button><p id="bmrR"></p></div>
</div>
</section>
<footer><p data-i18n="owner"></p></footer>
<script src="/lang.js"></script>
<script>
function calcBMI(){let h=document.getElementById('h').value/100,w=document.getElementById('w').value;if(!h||!w)return;let bmi=(w/(h*h)).toFixed(1);document.getElementById('bmiR').innerText='BMI: '+bmi}
function calcWater(){let w=document.getElementById('wt').value;document.getElementById('wR').innerText='Pani: '+(w*0.033).toFixed(2)+' Litre/day'}
function calcBMR(){let a=document.getElementById('age').value,w=document.getElementById('wh').value,h=document.getElementById('hh').value;let bmr=10*w+6.25*h-5*a+5;document.getElementById('bmrR').innerText='BMR: '+bmr.toFixed(0)+' cal/day'}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
