<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog - SwasthyaSalah</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="logo"><img src="/logo.png" alt="logo"><span data-i18n="site_name">SwasthyaSalah</span></div>
<nav><a href="/index.html" data-i18n="nav_home">Home</a><a href="/about.html" data-i18n="nav_about">About</a><a href="/blog.html" data-i18n="nav_blog">Blog</a><a href="/calculator.html" data-i18n="nav_calculator">Calculator</a><a href="/chatbot.html" data-i18n="nav_chatbot">Chatbot</a><a href="/contact.html" data-i18n="nav_contact">Contact</a><select id="langSelect" onchange="setLanguage(this.value)"><option value="hi">हिन्दी</option><option value="en-US">USA English</option><option value="en-GB">UK English</option></select></nav></header>
<section style="padding:20px 6%"><h1 data-i18n="blog_title">Blog</h1><p>Article add karna: niche ARTICLES array me naya object add karo.</p><div class="blogGrid" id="blogGrid"></div></section>
<footer><p><span data-i18n="site_name">SwasthyaSalah</span></p></footer>
<script src="/lang.js"></script>
<script>
const ARTICLES=[
  {"id":"haldi-doodh","title_hi":"Haldi Wala Doodh Ke Fayde","title_en":"Benefits of Turmeric Milk","cat":"Ayurveda","img":"hero.jpg"},
  {"id":"tulsi-ke-fayde","title_hi":"Tulsi Ke 10 Chamatkari Fayde","title_en":"10 Miraculous Benefits of Tulsi","cat":"Ayurveda","img":"hero.jpg"},
  {"id":"madhumeh-diet","title_hi":"Madhumeh Me Kya Khaye","title_en":"What to Eat in Diabetes","cat":"Diet","img":"hero.jpg"},
  {"id":"wajan-ghataye","title_hi":"7 Din Me Wajan Ghataye - Gharelu Upay","title_en":"How to Lose Weight in 7 Days - Home Remedies","cat":"Fitness","img":"hero.jpg"},
  {"id":"sardi-jukam","title_hi":"Sardi Jukam Ka Turant Ilaaj","title_en":"Instant Remedy for Cold and Cough","cat":"Home Remedy","img":"hero.jpg"},
  {"id":"acidity-upay","title_hi":"Acidity Ka Jad Se Ilaaj","title_en":"Permanent Cure for Acidity","cat":"Home Remedy","img":"hero.jpg"}
];
function renderBlogs(){
  const g=document.getElementById('blogGrid'); if(!g) return;
  const lang=CURRENT_LANG||'hi'; g.innerHTML='';
  ARTICLES.forEach(a=>{
    let title=lang.startsWith('en')?a.title_en:a.title_hi;
    g.innerHTML+=`<div class="article"><img src="/${a.img}" onerror="this.src='/hero.png'"><div class="p" style="padding:14px"><span style="background:#e6fffa;padding:2px 8px;border-radius:10px;font-size:12px">${a.cat}</span><h3 style="margin:8px 0">${title}</h3><button class="btn" onclick="localStorage.setItem('sw_q','${a.title_hi}');location.href='/chatbot.html'">Padhe / Read</button></div></div>`;
  });
}
document.addEventListener('DOMContentLoaded',renderBlogs);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
