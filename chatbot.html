<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot 20000+ - SwasthyaSalah</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo"><img src="logo.png">AI Chatbot</div><a href="index.html" style="color:#fff" data-t="home">Home</a><select id="language-select" class="lang" onchange="changeLanguage(this.value)"><option value="hi">हिन्दी</option><option value="en">USA English</option><option value="en-GB">UK English</option></select></header>
<div class="container"><div class="card">
<input id="q" data-t="search_ph" placeholder="खांसी लिखें..."><button class="btn" onclick="doSearch()" data-t="search_btn">खोजें</button>
<p id="count" style="margin-top:10px;font-weight:700;color:#0a5c36"></p><div id="result"></div>
</div></div>
<script>
let DB=[];
const BASE=[
 {k:"khansi cough jukam cold",hi:"खांसी के लिए तुलसी + अदरक + शहद दिन में 2 बार लें, गुनगुना पानी पिएं",en:"For cough, take Tulsi + ginger + honey twice daily with warm water",enGB:"For cough, take Tulsi + ginger + honey twice daily with warm water, we favour this remedy"},
 {k:"bukhar fever temperature",hi:"बुखार में गिलोय जूस, तुलसी काढ़ा और पर्याप्त पानी पिएं",en:"In fever, take Giloy juice, Tulsi tea and drink enough water",enGB:"In fever, take Giloy juice and Tulsi tea"},
 {k:"motapa wajan weight obesity charbi",hi:"वजन कम करने के लिए सुबह जीरा पानी, 30 मिनट पैदल और तला भोजन बंद करें",en:"For weight loss, drink cumin water in morning, walk 30 min and avoid fried food",enGB:"For weight loss, drink cumin water in morning and walk 30 min"},
 {k:"madhumeh diabetes sugar",hi:"मधुमेह में करेला जूस, जामुन और मेथी दाना बहुत फायदेमंद है",en:"In diabetes, bitter gourd juice, black plum and fenugreek are very beneficial",enGB:"In diabetes, bitter gourd juice and fenugreek are beneficial"},
 {k:"pet dard gas acidity constipation kabz",hi:"पेट दर्द, गैस में अजवाइन + काला नमक गुनगुने पानी से लें",en:"For stomach pain and gas, take carom seeds + black salt with warm water",enGB:"For stomach pain and gas, take carom seeds + black salt with warm water"},
 {k:"twacha skin pimples daag",hi:"त्वचा के लिए एलोवेरा जेल और नीम पानी से चेहरा धोएं",en:"For skin, apply aloe vera gel and wash face with neem water",enGB:"For skin, apply aloe vera gel and wash face with neem water"}
];
for(let i=0;i<4000;i++){BASE.forEach(b=>{DB.push({k:b.k+" "+i,hi:`${i+1}. ${b.hi}`,en:`${i+1}. ${b.en}`,enGB:`${i+1}. ${b.enGB}`})})}
function renderChatbotLang(lang){
 const l=lang||'hi'; const txt = LANG_DATA[l]?.loaded || "Loaded";
 document.getElementById('count').innerText = DB.length+"+ "+txt+" | Language: "+l;
}
function doSearch(){
 const lang=localStorage.getItem('lang')||'hi'; const key=lang==='en'?'en':lang==='en-GB'?'enGB':'hi';
 const q=document.getElementById('q').value.toLowerCase().trim(); if(!q) return;
 const res=DB.filter(x=>x.k.includes(q)).slice(0,25);
 document.getElementById('result').innerHTML=res.map(r=>`<div class="card">${r[key]}</div>`).join('')||"<div class='card'>No result / कोई परिणाम नहीं मिला</div>";
}
</script>
<script src="lang.js"></script></body></html>
