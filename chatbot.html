<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot - SwasthyaSalah</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="logo"><img src="/logo.png"><span data-i18n="site_name">SwasthyaSalah</span></div>
<nav><a href="/index.html" data-i18n="nav_home">Home</a><a href="/about.html" data-i18n="nav_about">About</a><a href="/blog.html" data-i18n="nav_blog">Blog</a><a href="/calculator.html" data-i18n="nav_calculator">Calculator</a><a href="/chatbot.html" data-i18n="nav_chatbot">Chatbot</a><a href="/contact.html" data-i18n="nav_contact">Contact</a><select id="langSelect" onchange="setLanguage(this.value)"><option value="hi">हिन्दी</option><option value="en-US">USA English</option><option value="en-GB">UK English</option></select></nav></header>
<section style="padding:10px 6%"><h1 data-i18n="chat_title">Chatbot - 21000+ Jawab</h1>
<div class="chatWrap"><div class="chatMsgs" id="chatMsgs"><div class="msg bot">Namaste! Main SwasthyaSalah hu. Sawaal pucho jaise 'sardi ke liye haldi kaise use kare?' - 21000 jawab offline ready hain. Bhasha badloge to jawab bhi usi bhasha me aayega.</div></div>
<div class="chatInput"><input id="chatInput" data-i18n-ph="chat_ph" placeholder="Sawal likhe"><button class="btn" onclick="ask()">Bheje</button></div></div>
</section>
<script src="/lang.js"></script>
<script src="/healthData.js"></script>
<script>
let qInit=localStorage.getItem('sw_q')||new URLSearchParams(location.search).get('q')||'';
if(qInit){setTimeout(()=>{document.getElementById('chatInput').value=qInit;ask();},700)}
function getAns(it){let l=CURRENT_LANG;if(l==='hi')return it.a_hi;if(l==='en-GB')return it.a_en_gb;return it.a_en_us;}
function getQ(it){return CURRENT_LANG==='hi'?it.q_hi:it.q_en;}
function ask(){
 let inp=document.getElementById('chatInput');let q=inp.value.trim().toLowerCase();if(!q)return;
 let msgs=document.getElementById('chatMsgs');msgs.innerHTML+=`<div class="msg user">${inp.value}</div>`;
 let keys=q.split(' ');let scored=HEALTH_DATA.map(it=>{let txt=(it.keywords+' '+it.q_hi+' '+it.q_en).toLowerCase();let s=0;keys.forEach(k=>{if(txt.includes(k))s++});return{it,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5);
 if(scored.length===0)scored=HEALTH_DATA.slice(0,3).map(it=>({it,s:0}));
 let html='';scored.forEach(({it})=>{html+=`<div class="msg bot"><b>${getQ(it)}</b><br>${getAns(it)}<br><small>${it.cat}</small></div>`});
 msgs.innerHTML+=html;msgs.scrollTop=msgs.scrollHeight;inp.value='';localStorage.removeItem('sw_q');
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
